[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wc2026-stein-forecaster"
version = "1.0.0"
description = "FIFA World Cup 2026 forecaster using James-Stein shrinkage estimation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vishwas Khandelwal", email = "vishwaskhandelwal94@gmail.com" }]
requires-python = ">=3.10"
keywords = ["statistics", "football", "james-stein", "shrinkage", "world-cup", "monte-carlo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "ipykernel>=6.0", "ipywidgets>=8.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
wc2026-run = "wc2026.pipeline:main"

[project.urls]
Homepage = "https://github.com/vishwaskhandelwal94/wc2026-stein-forecaster"
Repository = "https://github.com/vishwaskhandelwal94/wc2026-stein-forecaster"
Issues = "https://github.com/vishwaskhandelwal94/wc2026-stein-forecaster/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
